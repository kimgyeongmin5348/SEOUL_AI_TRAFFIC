services:
  - type: web
    name: roadpulse
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: NVIDIA_LLM_MODEL
        sync: false
      - key: NVIDIA_LLM_BASE_URL
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: VITE_KAKAO_MAP_JS_KEY
        sync: false
      - key: START_SCHEDULER_IN_PROCESS
        value: "true"

  - type: worker
    name: roadpulse-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m backend.src.workers.realtime_scheduler
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_ROLE
        value: worker
      - key: START_SCHEDULER_IN_PROCESS
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: SEOUL_TRAFFIC_API_KEY
        sync: false
      - key: SEOUL_INCIDENT_API_KEY
        sync: false
      - key: KMA_API_KEY
        sync: false
